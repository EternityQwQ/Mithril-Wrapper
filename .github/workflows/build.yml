name: Direct Metal verification

on:
  push:
    branches: [main, refactor/gl33-core-metal2]
  pull_request:
  workflow_dispatch:

jobs:
  macos-metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Direct Metal and tests
        run: >-
          cmake -S . -B build-macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_BUILD_TESTS=ON
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON
      - name: Build
        run: cmake --build build-macos --parallel
      - name: Run core and real Metal triangle tests
        run: ctest --test-dir build-macos --output-on-failure
      - name: Prove the shipping target is Vulkan-free
        shell: bash
        run: |
          set -euo pipefail
          dylib=$(find build-macos -type f -name 'libmithril.dylib' | head -1)
          test -n "$dylib"
          otool -L "$dylib"
          if otool -L "$dylib" | grep -Eqi 'vulkan|moltenvk'; then
            echo 'Forbidden Vulkan runtime dependency found' >&2
            exit 1
          fi
          if nm -gU "$dylib" | grep -Eqi ' _vk[A-Z]|moltenvk'; then
            echo 'Forbidden Vulkan symbol found' >&2
            exit 1
          fi
          if grep -Eqi 'vulkan|moltenvk|directvulkan' build-macos/mithril_direct.boundary.json; then
            echo 'Forbidden source or target dependency found' >&2
            exit 1
          fi

  ios-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch pinned iOS CMake toolchain
        run: >-
          curl -fsSL -o ios.toolchain.cmake
          https://raw.githubusercontent.com/leetal/ios-cmake/4.5.0/ios.toolchain.cmake
      - name: Configure iPhone arm64 (iOS 16 baseline)
        run: >-
          cmake -S . -B build-ios -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake
          -DPLATFORM=OS64
          -DDEPLOYMENT_TARGET=16.0
          -DENABLE_BITCODE=OFF
          -DENABLE_ARC=ON
          -DCMAKE_BUILD_TYPE=Release
          -DMITHRIL_BUILD_LEGACY=OFF
          -DMITHRIL_BUILD_DIRECT=ON
          -DMITHRIL_BUILD_TESTS=OFF
          -DMITHRIL_ENABLE_SHADER_TOOLCHAIN=ON
      - name: Build Direct Metal dylib
        run: cmake --build build-ios --target mithril_direct --parallel
      - name: Check architecture, exports and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          dylib=$(find build-ios -type f -name 'libmithril.dylib' | head -1)
          test -n "$dylib"
          file "$dylib" | grep -q arm64
          deps=$(otool -L "$dylib")
          printf '%s\n' "$deps"
          printf '%s\n' "$deps" | grep -q 'Metal.framework'
          if printf '%s\n' "$deps" | grep -Eqi 'vulkan|moltenvk'; then exit 1; fi
          symbols=$(nm -gU "$dylib")
          for symbol in eglGetDisplay eglInitialize eglChooseConfig eglCreateContext \
                        eglCreateWindowSurface eglMakeCurrent eglSwapBuffers eglGetProcAddress; do
            printf '%s\n' "$symbols" | grep -q " _$symbol$"
          done
          if printf '%s\n' "$symbols" | grep -Eqi ' _vk[A-Z]|moltenvk'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mithril-direct-ios-arm64
          path: build-ios/libmithril.dylib
          if-no-files-found: error
